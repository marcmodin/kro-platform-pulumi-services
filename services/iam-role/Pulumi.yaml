name: iam-role-service
description: On-demand IAM role and policy creation service for Pulumi Kubernetes Operator
runtime: go
config:
  aws:region:
    description: AWS region for the IAM resources
    value: eu-north-1
  iam-role-service:roleName:
    description: Name of the IAM role to create
  iam-role-service:description:
    description: Description for the IAM role
    default: ""
  iam-role-service:policies:
    description: |
      Policy configurations in format: policyType:resource1,resource2;policyType2:resource3
      Available policy types:
      - s3-full-access: Full access to S3 buckets
      - s3-read-only: Read-only access to S3 buckets
      - s3-write-only: Write-only access to S3 buckets
      - dynamodb-full-access: Full access to DynamoDB tables
      - dynamodb-read-only: Read-only access to DynamoDB tables
      Example: "s3-full-access:arn:aws:s3:::my-bucket;s3-read-only:arn:aws:s3:::public-bucket"
  iam-role-service:assumeRoleArn:
    description: ARN of the IAM role to assume in the target account (optional, for cross-account deployments)
    default: ""
  iam-role-service:trustPolicyType:
    description: |
      Type of trust policy for the IAM role. Determines who can assume the role.
      - account: Current AWS account root can assume the role
      - service: AWS service(s) can assume the role (requires trustedServices)
      - cross-account: External AWS account(s) can assume the role (requires trustedAccounts)
  iam-role-service:trustedServices:
    description: |
      Comma-separated list of AWS service principals that can assume the role.
      Required when trustPolicyType is "service".
      Example: "ec2.amazonaws.com" or "lambda.amazonaws.com,ecs-tasks.amazonaws.com"
    default: ""
  iam-role-service:trustedAccounts:
    description: |
      Comma-separated list of AWS account IDs that can assume the role.
      Required when trustPolicyType is "cross-account".
      Example: "111111111111" or "111111111111,222222222222"
    default: ""
pulumi:
  disable-default-providers: ["*"]