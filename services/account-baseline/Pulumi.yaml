name: account-baseline-service
description: Account baseline service that deploys platform-assumable IAM roles, password policy, region settings, and budgets
runtime: go
config:
  aws:region:
    description: AWS region
    value: eu-north-1
  # Required: cross-account trust
  account-baseline-service:trustedAccountId:
    description: AWS account ID that is allowed to assume the platform readonly role
  account-baseline-service:assumeRoleArn:
    description: ARN of the IAM role to assume for deployment (e.g., OrganizationAccountAccessRole)
    default: ""
  # Optional: Password policy settings
  account-baseline-service:passwordPolicyEnabled:
    description: Enable IAM account password policy
    default: true
  account-baseline-service:passwordPolicyMinLength:
    description: Minimum password length (default 14)
    default: 14
  account-baseline-service:passwordPolicyMaxAgeDays:
    description: Maximum password age in days (0 = no expiry)
    default: 90
  account-baseline-service:passwordPolicyReusePrevention:
    description: Number of previous passwords to prevent reuse (0 = no prevention)
    default: 10
  # Optional: Region settings
  account-baseline-service:enabledRegions:
    description: Comma-separated list of additional opt-in AWS regions to enable (e.g., "ap-east-1,me-south-1"). Only needed for opt-in regions not enabled by default.
    default: ""
  # Optional: Budget settings
  account-baseline-service:budgetEnabled:
    description: Enable monthly cost budget
    default: false
  account-baseline-service:budgetLimitAmount:
    description: Budget limit amount (default 100)
    default: "100"
  account-baseline-service:budgetLimitUnit:
    description: Budget limit currency (default USD)
    default: "USD"
  account-baseline-service:budgetNotificationEmail:
    description: Email address to receive budget notifications
    default: ""
  account-baseline-service:budgetThreshold:
    description: Budget threshold percentage for forecasted notification (default 80)
    default: 80
pulumi:
  disable-default-providers: ["*"]